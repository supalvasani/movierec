name: Movie Data Scraper Pipeline

on:
  schedule:
    # Run at 00:30 UTC (6:00 AM IST) — morning refresh, catches overnight releases
    - cron: '30 0 * * *'
    # Run at 12:30 UTC (6:00 PM IST) — evening refresh, catches Friday new releases going live
    - cron: '30 12 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI at any time

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run Scraper ETL Pipeline
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OMDB_API_KEY: ${{ secrets.VITE_OMDB_API_KEY }}
        run: |
          python pipeline/main.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "auto: refresh movie dataset $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push
